services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wavecast
      POSTGRES_PASSWORD: wavecast
      POSTGRES_DB: wavecast
    volumes:
      - wavecast-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wavecast -d wavecast"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      WAVECAST_DATABASE_URL: postgresql+asyncpg://wavecast:wavecast@postgres:5432/wavecast
      WAVECAST_AUDIO_ROOT: /var/lib/wavecast/audio
      WAVECAST_PROVIDER_MODE: mock
    volumes:
      - wavecast-audio:/var/lib/wavecast/audio
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      WAVECAST_INTERNAL_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  wavecast-postgres:
  wavecast-audio:
