<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>雾面：调频</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@200;300;400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
input::placeholder{color:#8E8E93}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F2F4; color: #1D1D1F; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; position: relative; overflow: hidden">
<span aria-hidden="true" style="position: absolute; left: -90px; top: -140px; width: 460px; height: 420px; border-radius: 50%; background: {{aura}}; opacity: {{auraOpacity}}; filter: blur(80px)"></span>
<span aria-hidden="true" style="position: absolute; right: -120px; top: 140px; width: 260px; height: 260px; border-radius: 50%; background: #E8834A; opacity: 0.12; filter: blur(70px)"></span>

<div style="position: relative; padding: 58px 20px 0; display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-size: 34px; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em">调频</h1>

<section aria-label="调谐" style="border-radius: 28px; background: rgba(255,255,255,0.62); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 0.5px solid rgba(255,255,255,0.8); box-shadow: 0 10px 30px rgba(29,29,31,0.06); padding: 20px 20px 18px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; align-items: baseline; gap: 6px">
<span style="font-size: 15px; font-weight: 500; color: #6E6E73">FM</span>
<span style="font-size: 56px; font-weight: 200; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">{{freq}}</span>
</div>
<span role="img" aria-label="{{signalLabel}}" style="display: flex; align-items: flex-end; gap: 3px; height: 18px; padding-bottom: 8px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="5">
<span style="width: 4px; height: {{b.h}}px; border-radius: 1.5px; background: {{b.c}}"></span>
</sc-for>
</span>
</div>

<div style="display: flex; flex-direction: column; gap: 4px; min-height: 52px">
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-size: 20px; font-weight: 600; color: {{nameColor}}">{{name}}</span>
<sc-if value="{{matched}}" hint-placeholder-val="{{false}}">
<span style="font-size: 12px; font-weight: 500; padding: 3px 8px; border-radius: 999px; background: rgba(201,160,74,0.18); color: #7A5A17">按描述对准</span>
</sc-if>
</div>
<p style="margin: 0; font-size: 15px; color: #6E6E73">{{desc}}</p>
</div>

<div role="slider" tabindex="0" aria-label="调频" aria-valuemin="87.5" aria-valuemax="108" aria-valuenow="{{freq}}" aria-valuetext="{{valueText}}" style="position: relative; height: 96px; border-radius: 18px; background: rgba(226,226,232,0.78); border: 0.5px solid rgba(29,29,31,0.08); box-shadow: inset 0 2px 6px rgba(29,29,31,0.16), inset 0 1px 1px rgba(29,29,31,0.08), 0 1px 0 rgba(255,255,255,0.95); overflow: hidden; cursor: grab">
<svg width="310" height="96" viewBox="0 0 310 96" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<path d="{{minor}}" style="fill: none; stroke: rgba(29,29,31,0.2); stroke-width: 1; stroke-linecap: round"></path>
<path d="{{major}}" style="fill: none; stroke: rgba(29,29,31,0.48); stroke-width: 1.2; stroke-linecap: round"></path>
<path d="{{noise}}" style="fill: rgba(29,29,31,0.16)"></path>
</svg>
<sc-for list="{{labels}}" as="l" hint-placeholder-count="3">
<span aria-hidden="true" style="position: absolute; top: 10px; left: {{l.x}}px; width: 80px; display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: {{l.w}}; color: {{l.c}}; white-space: nowrap">
<span style="width: 5px; height: 5px; border-radius: 50%; background: {{l.dot}}"></span>
{{l.name}}
</span>
</sc-for>
<sc-for list="{{nums}}" as="n" hint-placeholder-count="4">
<span aria-hidden="true" style="position: absolute; top: 62px; left: {{n.x}}px; width: 32px; text-align: center; font-size: 12px; font-weight: 300; color: #8E8E93; font-variant-numeric: tabular-nums">{{n.t}}</span>
</sc-for>
<span aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: 48px; background: linear-gradient(90deg, rgba(228,228,234,0.96), rgba(228,228,234,0))"></span>
<span aria-hidden="true" style="position: absolute; right: 0; top: 0; bottom: 0; width: 48px; background: linear-gradient(270deg, rgba(228,228,234,0.96), rgba(228,228,234,0))"></span>
<span aria-hidden="true" style="position: absolute; left: 154px; top: 8px; bottom: 8px; width: 2px; border-radius: 1px; background: #FF6B2C; box-shadow: 0 0 8px rgba(255,107,44,0.55)"></span>
</div>

<div aria-hidden="true" style="position: relative; height: 26px; border-radius: 13px; background: linear-gradient(180deg, rgba(29,29,31,0.07), rgba(255,255,255,0.75) 50%, rgba(29,29,31,0.09)); box-shadow: inset 0 0 0 0.5px rgba(29,29,31,0.08); overflow: hidden">
<svg width="310" height="26" viewBox="0 0 310 26" style="position: absolute; left: 0; top: 0">
<path d="{{knurl}}" style="fill: none; stroke: rgba(29,29,31,0.16); stroke-width: 1"></path>
</svg>
</div>
</section>

<label style="display: flex">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">想听什么</span>
<input type="text" value="{{text}}" placeholder="说一个歌手、一首歌，或者你在做什么" readonly="{{true}}" style="width: 100%; height: 56px; box-sizing: border-box; border: 0.5px solid rgba(255,255,255,0.8); border-radius: 16px; background: rgba(255,255,255,0.72); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 0 18px; font-family: inherit; font-size: 17px; color: #1D1D1F; outline: none">
</label>

<div role="radiogroup" aria-label="时长" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 3px; border-radius: 12px; background: rgba(118,118,128,0.12)">
<button type="button" role="radio" aria-checked="false" style="height: 36px; border: 0; border-radius: 9px; background: transparent; font-family: inherit; font-size: 14px; color: #1D1D1F">15 分钟</button>
<button type="button" role="radio" aria-checked="true" style="height: 36px; border: 0; border-radius: 9px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.1); font-family: inherit; font-size: 14px; font-weight: 600; color: #1D1D1F">半小时</button>
<button type="button" role="radio" aria-checked="false" style="height: 36px; border: 0; border-radius: 9px; background: transparent; font-family: inherit; font-size: 14px; color: #1D1D1F">一小时</button>
</div>

<button type="button" disabled="{{between}}" style="height: 54px; border: 0; border-radius: 999px; background: #1D1D1F; color: #FFFFFF; opacity: {{ctaOpacity}}; font-family: inherit; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px">
<span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #FF6B2C; box-shadow: 0 0 0 4px rgba(255,107,44,0.25)"></span>
{{cta}}
</button>
</div>

<nav aria-label="主导航" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 24px 26px; background: rgba(242,242,244,0.78); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-top: 0.5px solid rgba(60,60,67,0.18); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #8E8E93; text-decoration: none; font-size: 11px; font-weight: 500"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"></path></svg>首页</a>
<a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #1D1D1F; text-decoration: none; font-size: 11px; font-weight: 600"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><rect x="2.5" y="8" width="19" height="9" rx="4.5"></rect><path d="M6.5 12.5h.01M9.5 12.5h.01M17.5 12.5h.01"></path><path d="M13.5 5.5v13"></path></svg>调频</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #8E8E93; text-decoration: none; font-size: 11px; font-weight: 500"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="4" height="16" rx="1"></rect><rect x="10" y="4" width="4" height="16" rx="1"></rect><path d="m16 5.4 3.4-0.9 2.9 13.9-3.4 0.9z"></path></svg>节目库</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["locked","between"],"default":"locked"},"$preview":{"width":390,"height":844}}'>
const STATIONS = [
  { name: '随便听', f: 88.7, color: '#E8834A' },
  { name: '唱片行', f: 93.1, color: '#3E9C8C' },
  { name: '人物志', f: 97.4, color: '#C9A04A' },
  { name: '来龙去脉', f: 101.5, color: '#5C7CE0' },
  { name: '夜里', f: 105.8, color: '#6E62B6' },
];
const r2 = (n) => Math.round(n * 100) / 100;
function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

class Component extends DCLogic {
  renderVals() {
    const between = this.props.state === 'between';
    const F = between ? 95.2 : 97.4;
    const W = 310, px = 38.75, lo = F - W / 2 / px;
    let minor = '', major = '';
    const nums = [];
    for (let i = Math.ceil(lo * 5); i <= Math.floor((lo + W / px) * 5); i++) {
      const f = i / 5, x = r2((f - lo) * px);
      const isInt = i % 5 === 0, isHalf = !isInt && Math.abs(f * 2 - Math.round(f * 2)) < 0.001;
      const h = isInt ? 18 : isHalf ? 12 : 7;
      const seg = 'M' + x + ' ' + (52 - h) + 'V52';
      if (isInt) {
        major += seg;
        if (i % 10 === 0) nums.push({ x: r2(x - 16), t: String(f) });
      } else minor += seg;
    }
    const cur = STATIONS.find((s) => s.f === F);
    const labels = STATIONS.filter((s) => s.f > lo + 0.4 && s.f < lo + W / px - 0.4).map((s) => ({
      name: s.name,
      x: r2((s.f - lo) * px - 40),
      dot: s.color,
      w: cur && s.f === F ? 600 : 400,
      c: cur && s.f === F ? '#1D1D1F' : '#8E8E93',
    }));
    let noise = '';
    if (between) {
      const R = rng(7);
      for (let k = 0; k < 260; k++) {
        const x = R() * 310, y = R() * 96, rr = 0.4 + R() * 0.6;
        noise += 'M' + r2(x - rr) + ' ' + r2(y) + 'a' + r2(rr) + ' ' + r2(rr) + ' 0 1 0 ' + r2(2 * rr) + ' 0a' + r2(rr) + ' ' + r2(rr) + ' 0 1 0 ' + r2(-2 * rr) + ' 0Z';
      }
    }
    let knurl = '';
    const N = 30, maxA = (70 * Math.PI) / 180;
    for (let k = 0; k <= N; k++) {
      const a = -maxA + (2 * maxA * k) / N;
      const x = 155 + (148 * Math.sin(a)) / Math.sin(maxA);
      knurl += 'M' + r2(x) + ' 7V19';
    }
    const lit = between ? 1 : 5;
    const bars = [6, 9, 12, 15, 18].map((h, i) => ({ h, c: i < lit ? '#1D1D1F' : 'rgba(29,29,31,0.15)' }));
    return {
      between,
      freq: F.toFixed(1),
      name: between ? '两个台之间' : cur.name,
      nameColor: between ? '#8E8E93' : '#1D1D1F',
      desc: between ? '松手会自动对准最近的台' : '用一位歌手的作品，讲他走过的路',
      matched: !between,
      signalLabel: between ? '信号弱' : '信号满格',
      valueText: between ? 'FM ' + F.toFixed(1) + '，没有电台' : 'FM ' + F.toFixed(1) + ' ' + cur.name,
      aura: between ? '#B8B8C0' : '#C9A04A',
      auraOpacity: between ? 0.22 : 0.32,
      minor, major, nums, labels, noise, knurl, bars,
      text: between ? '' : '方大同这些年的歌',
      cta: between ? '先对准一个台' : '在 FM 97.4 开播',
      ctaOpacity: between ? 0.3 : 1,
    };
  }
}
</script>
</body>
</html>
