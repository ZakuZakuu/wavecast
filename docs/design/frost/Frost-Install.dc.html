<!doctype html>
<html lang="zh-CN">
<head>

</head>

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@200;300;400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; color: #1D1D1F">
<div aria-hidden="true" style="position: absolute; inset: 0">
<dc-import name="Frost-Home" hint-size="390px,844px"></dc-import>
</div>
<span aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.3)"></span>

<section role="dialog" aria-labelledby="pwa-title" style="position: absolute; left: 10px; right: 10px; bottom: 96px; box-sizing: border-box; border-radius: 30px; background: rgba(250,250,252,0.94); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); box-shadow: 0 20px 50px rgba(0,0,0,0.25); padding: 28px 22px 20px; display: flex; flex-direction: column; align-items: center; text-align: center">
<div aria-hidden="true" style="width: 76px; filter: drop-shadow(0 6px 16px rgba(29,29,31,0.16))">
<dc-import name="LogoMark" variant="radio" hint-size="76px,76px"></dc-import>
</div>
<h2 id="pwa-title" style="margin: 16px 0 0; font-size: 22px; font-weight: 700">把 WaveCast 放到主屏幕</h2>
<p style="margin: 8px 0 0; font-size: 15px; line-height: 1.6; color: #6E6E73">以后点图标就能直接打开，全屏收听，<br>不用再找网址。</p>

<ol style="list-style: none; margin: 20px 0 0; padding: 0; width: 100%; display: flex; flex-direction: column; gap: 8px; text-align: left">
<li style="height: 52px; box-sizing: border-box; border-radius: 14px; background: #FFFFFF; padding: 0 14px; display: flex; align-items: center; gap: 12px; font-size: 15px">
<span style="width: 24px; height: 24px; border-radius: 50%; background: #1D1D1F; color: #FFFFFF; display: grid; place-items: center; font-size: 13px; font-weight: 600; flex-shrink: 0">1</span>
<span style="flex-grow: 1">点浏览器底部的分享按钮</span>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#007AFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4"></path><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"></path></svg>
</li>
<li style="height: 52px; box-sizing: border-box; border-radius: 14px; background: #FFFFFF; padding: 0 14px; display: flex; align-items: center; gap: 12px; font-size: 15px">
<span style="width: 24px; height: 24px; border-radius: 50%; background: #1D1D1F; color: #FFFFFF; display: grid; place-items: center; font-size: 13px; font-weight: 600; flex-shrink: 0">2</span>
<span style="flex-grow: 1">选择“添加到主屏幕”</span>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D1D1F" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"></rect><path d="M12 8.5v7M8.5 12h7"></path></svg>
</li>
<li style="height: 52px; box-sizing: border-box; border-radius: 14px; background: #FFFFFF; padding: 0 14px; display: flex; align-items: center; gap: 12px; font-size: 15px">
<span style="width: 24px; height: 24px; border-radius: 50%; background: #1D1D1F; color: #FFFFFF; display: grid; place-items: center; font-size: 13px; font-weight: 600; flex-shrink: 0">3</span>
<span style="flex-grow: 1">点右上角的“添加”</span>
</li>
</ol>

<button type="button" style="margin-top: 18px; width: 100%; height: 52px; border: 0; border-radius: 999px; background: #1D1D1F; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600">知道了</button>
<button type="button" style="margin-top: 6px; width: 100%; height: 44px; border: 0; background: transparent; font-family: inherit; font-size: 15px; color: #6E6E73">以后再说</button>
</section>

<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 34px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #FFFFFF">
<span style="font-size: 13px; font-weight: 600; text-shadow: 0 1px 6px rgba(0,0,0,0.4)">分享按钮在这里</span>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v15M6 13l6 6 6-6"></path></svg>

</div>
