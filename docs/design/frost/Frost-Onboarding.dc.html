<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>雾面：首次偏好</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@200;300;400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; color: #1D1D1F">
<div aria-hidden="true" style="position: absolute; inset: 0">
<dc-import name="Frost-Home" hint-size="390px,844px"></dc-import>
</div>
<span aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.28)"></span>

<section role="dialog" aria-labelledby="ob-title" style="position: absolute; left: 0; right: 0; bottom: 0; height: 700px; box-sizing: border-box; border-radius: 28px 28px 0 0; background: rgba(246,246,248,0.94); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); padding: 10px 24px 34px; display: flex; flex-direction: column">
<span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: rgba(60,60,67,0.3)"></span>
<div style="margin-top: 14px; display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 13px; font-weight: 500; color: #6E6E73; font-variant-numeric: tabular-nums">1 / 2</span>
<button type="button" style="height: 32px; padding: 0 4px; border: 0; background: transparent; font-family: inherit; font-size: 15px; color: #6E6E73">跳过</button>
</div>
<h2 id="ob-title" style="margin: 14px 0 0; font-size: 28px; font-weight: 700; line-height: 1.3">平时爱听什么？</h2>
<p style="margin: 8px 0 0; font-size: 15px; line-height: 1.6; color: #6E6E73">选几个就好，之后随时能在账户里改。</p>

<div role="group" aria-label="音乐风格" style="margin-top: 24px; display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{genres}}" as="g" hint-placeholder-count="12">
<button type="button" aria-pressed="{{g.on}}" style="height: 44px; padding: 0 18px; border: {{g.border}}; border-radius: 999px; background: {{g.bg}}; color: {{g.color}}; font-family: inherit; font-size: 16px; font-weight: {{g.weight}}; display: flex; align-items: center; gap: 6px">
<sc-if value="{{g.on}}" hint-placeholder-val="{{false}}">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7"></path></svg>
</sc-if>
{{g.name}}
</button>
</sc-for>
</div>

<label style="margin-top: 22px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 15px; font-weight: 600">有特别喜欢的歌手吗</span>
<input type="text" placeholder="比如：方大同、坂本龙一" style="height: 50px; box-sizing: border-box; border: 0; border-radius: 14px; background: rgba(118,118,128,0.12); padding: 0 16px; font-family: inherit; font-size: 17px; color: #1D1D1F; outline: none">
</label>

<button type="button" style="margin-top: auto; height: 54px; border: 0; border-radius: 999px; background: #1D1D1F; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600">继续（已选 3 个）</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const picked = ['R&B', '爵士', 'City Pop'];
    const genres = ['华语流行', 'R&B', '爵士', 'City Pop', '电子', '民谣', '摇滚', '独立', 'Hip-hop', '古典', '氛围', '原声带'].map((name) => {
      const on = picked.includes(name);
      return {
        name, on,
        bg: on ? '#1D1D1F' : '#FFFFFF',
        color: on ? '#FFFFFF' : '#1D1D1F',
        border: on ? '0' : '0.5px solid rgba(60,60,67,0.2)',
        weight: on ? 600 : 400,
      };
    });
    return { genres };
  }
}
</script>
</body>
</html>
