<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>节目封面：标题一体</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@200;300;500;700;900&amp;family=Noto+Serif+SC:wght@700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; aspect-ratio: 1 / 1; position: relative; overflow: hidden; container-type: inline-size; background: {{bg}}; border-radius: {{radius}}px; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif">
<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block" aria-hidden="true">
<path d="{{s0.d}}" style="fill: {{s0.fill}}; fill-opacity: {{s0.o}}; stroke: {{s0.stroke}}; stroke-width: {{s0.sw}}; stroke-opacity: {{s0.so}}; stroke-linecap: round; stroke-linejoin: round"></path>
<path d="{{s1.d}}" style="fill: {{s1.fill}}; fill-opacity: {{s1.o}}; stroke: {{s1.stroke}}; stroke-width: {{s1.sw}}; stroke-opacity: {{s1.so}}; stroke-linecap: round; stroke-linejoin: round"></path>
<path d="{{s2.d}}" style="fill: {{s2.fill}}; fill-opacity: {{s2.o}}; stroke: {{s2.stroke}}; stroke-width: {{s2.sw}}; stroke-opacity: {{s2.so}}; stroke-linecap: round; stroke-linejoin: round"></path>
<path d="{{s3.d}}" style="fill: {{s3.fill}}; fill-opacity: {{s3.o}}; stroke: {{s3.stroke}}; stroke-width: {{s3.sw}}; stroke-opacity: {{s3.so}}; stroke-linecap: round; stroke-linejoin: round"></path>
<path d="{{s4.d}}" style="fill: {{s4.fill}}; fill-opacity: {{s4.o}}; stroke: {{s4.stroke}}; stroke-width: {{s4.sw}}; stroke-opacity: {{s4.so}}; stroke-linecap: round; stroke-linejoin: round"></path>
<path d="{{s5.d}}" style="fill: {{s5.fill}}; fill-opacity: {{s5.o}}; stroke: {{s5.stroke}}; stroke-width: {{s5.sw}}; stroke-opacity: {{s5.so}}; stroke-linecap: round; stroke-linejoin: round"></path>
</svg>

<sc-if value="{{t.freq}}" hint-placeholder-val="{{false}}">
<span aria-hidden="true" style="position: absolute; left: 3cqw; bottom: -6cqw; font-size: 34cqw; font-weight: 200; line-height: 1; letter-spacing: -0.05em; color: {{p1}}">{{freq}}</span>
<span style="position: absolute; left: 7cqw; top: 7cqw; right: 7cqw; display: flex; flex-direction: column; gap: 2cqw">
<span style="font-size: {{titleSize}}cqw; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; white-space: pre-line; color: {{onBg}}">{{heading}}</span>
<span style="font-size: 5cqw; font-weight: 500; color: {{onBg}}; opacity: 0.75">{{station}}</span>
</span>
</sc-if>

<sc-if value="{{t.label}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; left: 21cqw; top: 21cqw; width: 58cqw; height: 58cqw; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.6cqw; text-align: center">
<span style="font-family: 'Noto Serif SC', serif; font-size: {{titleSize}}cqw; font-weight: 900; line-height: 1.2; white-space: pre-line; color: {{onP2}}">{{heading}}</span>
<span style="font-size: 4cqw; font-weight: 500; letter-spacing: 0.08em; color: {{onP2}}; opacity: 0.72">{{station}}</span>
</span>
<span style="position: absolute; right: 5cqw; bottom: 4cqw; font-size: 4.4cqw; font-weight: 300; color: {{onBg}}; opacity: 0.75">FM {{freq}}</span>
</sc-if>

<sc-if value="{{t.horizon}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; left: 7cqw; bottom: 38cqw; width: 60cqw; font-size: {{titleSize}}cqw; font-weight: 700; line-height: 1.15; white-space: pre-line; color: {{onBg}}">{{heading}}</span>
<span style="position: absolute; left: 7cqw; top: 69cqw; display: flex; gap: 2.4cqw; font-size: 4.8cqw; color: {{onBg}}; opacity: 0.72">
<span style="font-weight: 300">FM {{freq}}</span>
<span style="font-weight: 500">{{station}}</span>
</span>
</sc-if>

<sc-if value="{{t.column}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; left: 0; top: 0; width: 40cqw; height: 80cqw; display: flex; justify-content: center; padding-top: 8cqw; box-sizing: border-box">
<span style="writing-mode: vertical-rl; font-family: 'Noto Serif SC', serif; font-size: {{titleSize}}cqw; font-weight: 900; line-height: 1.25; letter-spacing: 0.08em; white-space: pre-line; color: {{onP2}}">{{heading}}</span>
</span>
<span style="position: absolute; left: 0; bottom: 6cqw; width: 40cqw; display: flex; flex-direction: column; align-items: center; gap: 0.8cqw; color: {{onP2}}">
<span style="font-size: 4.6cqw; font-weight: 500; opacity: 0.8">{{station}}</span>
<span style="font-size: 5.4cqw; font-weight: 200">{{freq}}</span>
</span>
</sc-if>

<sc-if value="{{t.contour}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; left: 7cqw; top: 7cqw; width: 64cqw; display: flex; flex-direction: column; gap: 2cqw">
<span style="font-size: {{titleSize}}cqw; font-weight: 700; line-height: 1.15; white-space: pre-line; color: {{onBg}}">{{heading}}</span>
<span style="display: flex; gap: 2.4cqw; font-size: 4.8cqw; color: {{onBg}}; opacity: 0.72">
<span style="font-weight: 300">FM {{freq}}</span>
<span style="font-weight: 500">{{station}}</span>
</span>
</span>
</sc-if>

<sc-if value="{{t.split}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; left: 7cqw; right: 7cqw; bottom: {{splitBottom}}cqw; font-size: {{titleSize}}cqw; font-weight: 700; line-height: 1.12; letter-spacing: -0.01em; white-space: pre-line; color: {{onP1}}">{{heading}}</span>
<span style="position: absolute; left: 7cqw; top: {{splitTop}}cqw; display: flex; gap: 2.4cqw; font-size: 4.8cqw; color: {{onBg}}; opacity: 0.75">
<span style="font-weight: 300">FM {{freq}}</span>
<span style="font-weight: 500">{{station}}</span>
</span>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"template":{"editor":"enum","options":["freq","label","horizon","column","contour","split"],"default":"column"},"heading":{"editor":"text","default":"方大同这些年"},"station":{"editor":"text","default":"人物志"},"freq":{"editor":"text","default":"97.4"},"seed":{"editor":"int","min":0,"max":999,"default":3},"bg":{"editor":"color","default":"#F1E9D8"},"p1":{"editor":"color","default":"#B0823A"},"p2":{"editor":"color","default":"#2E2A24"},"ink":{"editor":"color","default":"#2E2A24"},"bare":{"editor":"boolean","default":false},"radius":{"editor":"int","min":0,"max":40,"default":12},"$preview":{"width":320,"height":320}}'>
const r2 = (n) => Math.round(n * 100) / 100;

function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function circ(cx, cy, r) {
  return 'M' + r2(cx - r) + ' ' + r2(cy) + 'a' + r2(r) + ' ' + r2(r) + ' 0 1 0 ' + r2(2 * r) + ' 0a' + r2(r) + ' ' + r2(r) + ' 0 1 0 ' + r2(-2 * r) + ' 0Z';
}

function box(x, y, w, h) {
  return 'M' + r2(x) + ' ' + r2(y) + 'h' + r2(w) + 'v' + r2(h) + 'h' + r2(-w) + 'Z';
}

function lum(hex) {
  const h = String(hex || '#000000').replace('#', '');
  const v = [0, 2, 4].map((i) => parseInt(h.substr(i, 2), 16) / 255)
    .map((c) => (c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)));
  return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
}

function textOn(hex) {
  return lum(hex) > 0.34 ? '#1C1C1E' : '#FAF8F4';
}

function visLen(s) {
  let n = 0;
  for (const ch of s) n += /[\u3400-\u9fff]/.test(ch) ? 1 : 0.56;
  return n;
}

function longestLine(text) {
  return Math.max(1, ...String(text).split('\n').map(visLen));
}

const TEMPLATES = {
  freq(R, c, m) {
    let ticks = '';
    for (let i = 0; i <= 40; i++) {
      const x = 6 + i * 2.2;
      ticks += 'M' + r2(x) + ' ' + (i % 5 === 0 ? 55.5 : 58.5) + 'V61';
    }
    const f = parseFloat(m.freq) || 97.4;
    const fx = 6 + ((f - 87) / 21) * 88;
    return {
      slots: [
        { d: ticks, stroke: c.p1, sw: 0.45, so: 0.75 },
        { d: 'M' + r2(fx) + ' 51.5V63', stroke: c.p2, sw: 1.1 },
        { d: circ(fx, 50.5, 1.5), fill: c.p2 },
      ],
      size: Math.min(15, 80 / longestLine(m.heading)),
    };
  },
  label(R, c, m) {
    let grooves = '';
    for (let r = 33; r < 49; r += 1.7 + R() * 0.5) grooves += circ(50, 50, r);
    const ri = 36 + R() * 11, a0 = R() * 6.28, a1 = a0 + 0.7 + R() * 1.2;
    const arc = 'M' + r2(50 + ri * Math.cos(a0)) + ' ' + r2(50 + ri * Math.sin(a0)) + 'A' + r2(ri) + ' ' + r2(ri) + ' 0 0 1 ' + r2(50 + ri * Math.cos(a1)) + ' ' + r2(50 + ri * Math.sin(a1));
    return {
      slots: [
        { d: grooves, stroke: c.p1, sw: 0.35, so: 0.6 },
        { d: arc, stroke: c.p1, sw: 1.1 },
        { d: circ(50, 50, 31), fill: c.p2 },
      ],
      size: Math.min(10.5, 46 / longestLine(m.heading)),
    };
  },
  horizon(R, c, m) {
    const hy = 64, r = 12 + R() * 4, cx = 80 + R() * 6, cy = hy + r * 0.18;
    let refl = '';
    for (let i = 0; i < 6; i++) {
      const y = hy + 3.2 + i * 4.2, w = r * 1.6 * (1 - i * 0.14);
      refl += box(cx - w / 2, y, w, 1.1 - i * 0.12);
    }
    return {
      slots: [
        { d: circ(cx, cy, r * 1.9), fill: c.p1, o: 0.18 },
        { d: circ(cx, cy, r * 1.4), fill: c.p1, o: 0.3 },
        { d: circ(cx, cy, r), fill: c.p2 },
        { d: box(0, hy, 100, 36), fill: c.bg },
        { d: refl, fill: c.p2, o: 0.45 },
        { d: box(0, hy - 0.2, 100, 0.4), fill: c.p1, o: 0.7 },
      ],
      size: Math.min(14, 58 / longestLine(m.heading)),
    };
  },
  column(R, c, m) {
    let dots = '', big = '';
    const cols = 6, rows = 11, x0 = 48, y0 = 7, step = 8.4;
    const fx = R() * cols, fy = R() * rows;
    for (let i = 0; i < cols; i++) {
      for (let j = 0; j < rows; j++) {
        const d = Math.hypot(i - fx, j - fy);
        const rr = Math.max(0.35, 3.4 - d * 0.42 + (R() - 0.5) * 0.5);
        if (rr > 3) big += circ(x0 + i * step, y0 + j * step + 1, rr);
        else dots += circ(x0 + i * step, y0 + j * step + 1, rr);
      }
    }
    return {
      slots: [
        { d: box(0, 0, 40, 100), fill: c.p2 },
        { d: dots, fill: c.p1 },
        { d: big, fill: c.p1, o: 0.85 },
      ],
      size: Math.min(14.5, 64 / longestLine(m.heading)),
    };
  },
  contour(R, c, m) {
    const cx = 68 + R() * 10, cy = 70 + R() * 10, ph1 = R() * 6.28, ph2 = R() * 6.28;
    const zone = (x, y) => x < 74 && y < 46;
    let lines = '', inner = '';
    for (let j = 1; j <= 13; j++) {
      const base = j * 6.8 + R();
      let seg = '', drawing = false;
      for (let k = 0; k <= 80; k++) {
        const t = (k / 80) * Math.PI * 2;
        const rr = base * (1 + 0.12 * Math.sin(3 * t + ph1 + j * 0.2) + 0.06 * Math.sin(5 * t + ph2));
        const x = cx + rr * Math.cos(t), y = cy + rr * Math.sin(t);
        if (zone(x, y)) { drawing = false; continue; }
        seg += (drawing ? 'L' : 'M') + r2(x) + ' ' + r2(y);
        drawing = true;
      }
      if (j === 1) inner = seg + 'Z';
      else lines += seg;
    }
    return {
      slots: [
        { d: lines, stroke: c.p1, sw: 0.5 },
        { d: inner, fill: c.p2 },
      ],
      size: Math.min(13.5, 64 / longestLine(m.heading)),
    };
  },
  split(R, c, m) {
    const split = 58 + R() * 8;
    let rules = '';
    for (let i = 0; i < 3; i++) rules += box(7, split + 16 + i * 5.5, 40 - i * 9, 0.35);
    return {
      slots: [
        { d: box(0, 0, 100, split), fill: c.p1 },
        { d: circ(80 + R() * 6, split + 18 + R() * 8, 5 + R() * 3), fill: c.p2 },
        { d: rules, fill: c.ink, o: 0.3 },
      ],
      size: Math.min(15, 86 / longestLine(m.heading)),
      split,
    };
  },
};

function norm(s) {
  return {
    d: s && s.d ? s.d : 'M0 0',
    fill: s && s.fill ? s.fill : 'none',
    o: s && s.o !== undefined ? s.o : 1,
    stroke: s && s.stroke ? s.stroke : 'none',
    sw: s && s.sw !== undefined ? s.sw : 0,
    so: s && s.so !== undefined ? s.so : 1,
  };
}

class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const template = TEMPLATES[p.template] ? p.template : 'column';
    const seed = Number(p.seed ?? 3) || 0;
    const c = {
      bg: p.bg ?? '#F1E9D8',
      p1: p.p1 ?? '#B0823A',
      p2: p.p2 ?? '#2E2A24',
      ink: p.ink ?? '#2E2A24',
    };
    const meta = {
      heading: p.heading ?? '方大同这些年',
      station: p.station ?? '人物志',
      freq: p.freq ?? '97.4',
    };
    const R = rng(seed * 7919 + template.length * 131 + 29);
    const out = TEMPLATES[template](R, c, meta);
    const slots = out.slots.map(norm);
    while (slots.length < 6) slots.push(norm(null));
    const bare = p.bare === true || p.bare === 'true';
    const t = { freq: false, label: false, horizon: false, column: false, contour: false, split: false };
    if (!bare) t[template] = true;
    const split = out.split ?? 60;
    return {
      bg: c.bg,
      p1: c.p1,
      radius: p.radius ?? 12,
      s0: slots[0], s1: slots[1], s2: slots[2], s3: slots[3], s4: slots[4], s5: slots[5],
      t,
      heading: meta.heading,
      station: meta.station,
      freq: meta.freq,
      titleSize: r2(out.size),
      onBg: textOn(c.bg),
      onP1: textOn(c.p1),
      onP2: textOn(c.p2),
      splitBottom: r2(100 - split + 3),
      splitTop: r2(split + 5),
    };
  }
}
</script>
</body>
</html>
