const W=WC,NS="http://www.w3.org/2000/svg";

 const st=document.getElementById("stations");S.forEach(([n,f,c,l])=>{const a=document.createElement("div");a.style.cssText=`flex:0 0 132px;height:152px;box-sizing:border-box;border-radius:20px;background:${c};color:#fff;padding:14px 16px 16px;display:flex;flex-direction:column;justify-content:space-between`;
