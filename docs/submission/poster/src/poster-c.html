<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>WaveCast poster C</title>
<link rel="stylesheet" href="shared.css">
<style>
body{background:#070A14;color:#F3F1FA}
.poster{background:
 radial-gradient(760px 760px at 50% 48%,rgba(110,98,182,.42),transparent 66%),
 radial-gradient(700px 500px at 100% 0%,rgba(255,107,44,.20),transparent 62%),
 radial-gradient(700px 600px at 0% 100%,rgba(62,156,140,.20),transparent 62%),
 linear-gradient(180deg,#0F1330,#0A0D20 55%,#070A14)}
.hd{left:80px;right:80px;top:58px;display:flex;align-items:center;justify-content:space-between}
.hd .brand{display:flex;align-items:center;gap:16px;font-size:32px;font-weight:500}
.hd .brand svg{width:56px;height:56px}
.hd .fm{font-size:22px;font-weight:300;letter-spacing:.28em;color:rgba(243,241,250,.5)}
h1{left:80px;top:128px;font-family:var(--serif);font-weight:900;font-size:92px;line-height:1.14;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--accent)}
.sub{left:84px;top:342px;font-size:25px;font-weight:300;color:rgba(243,241,250,.7)}
.sub b{font-weight:500;color:#fff}
.disc{position:absolute;left:50%;top:860px;width:540px;height:540px;margin:-270px 0 0 -270px;border-radius:50%;text-align:center;
 background:radial-gradient(circle at 35% 25%,#2E3170,#14163A 62%,#0D0F2A);box-shadow:0 40px 90px rgba(0,0,0,.55),inset 0 0 0 1.5px rgba(255,255,255,.14),inset 0 2px 0 rgba(255,255,255,.18)}
.tag{display:inline-flex;align-items:center;gap:10px;font-size:19px;font-weight:500;letter-spacing:.14em;color:#FF9A6B}
.tag i{font-style:normal;min-width:30px;height:30px;padding:0 7px;border-radius:15px;background:var(--accent);color:#fff;font-size:17px;font-weight:700;display:grid;place-items:center;letter-spacing:0}
.q{font-size:42px;font-weight:300;line-height:1.3;letter-spacing:.01em}
.q i{display:inline-block;width:3px;height:40px;background:var(--accent);margin-left:5px;vertical-align:-7px;box-shadow:0 0 12px var(--accent)}
.pt{font-family:var(--serif);font-weight:900;font-size:58px;line-height:1.1}
.pm{font-size:20px;font-weight:300;color:rgba(243,241,250,.66);letter-spacing:.04em}
.leg{left:0;right:0;top:1338px;display:flex;justify-content:center;align-items:center;gap:30px;font-size:18px;font-weight:300;color:rgba(243,241,250,.66)}
.leg span{display:flex;align-items:center;gap:9px}
.leg u{display:block;width:26px;height:8px;border-radius:4px}
.blk-l{left:80px;top:1396px;width:330px}
.blk-l .t{font-family:var(--serif);font-weight:900;font-size:44px;line-height:1.2}
.blk-l .t em{font-style:normal;color:var(--accent)}
.blk-l p{margin-top:14px;font-size:21px;line-height:1.55;font-weight:300;color:rgba(243,241,250,.7)}
.blk-l p b{font-weight:500;color:#fff}
.qr{position:absolute;left:80px;top:1620px;display:flex;align-items:center;gap:20px}
.qr .q2{width:116px;height:116px;border-radius:18px;background:#F3F1FA;padding:10px}
.qr .u{font-family:var(--num);font-size:30px;font-weight:300;letter-spacing:.02em}
.qr .u em{font-style:normal;color:var(--accent)}
.qr .h{font-size:16px;font-weight:300;color:rgba(243,241,250,.55);margin-top:4px;line-height:1.45}
.card{position:absolute;top:1404px;width:150px}
.card .cv{border-radius:20px;overflow:hidden;box-shadow:0 20px 44px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.1)}
.card .ti{margin-top:12px;font-size:17px;font-weight:500;line-height:1.35}
.card .me{margin-top:3px;font-size:15px;font-weight:300;color:rgba(243,241,250,.55)}
.foot{left:80px;right:80px;bottom:28px;display:flex;justify-content:space-between;font-size:17px;font-weight:300;color:rgba(243,241,250,.42)}
</style></head><body>
<div class="poster">
  <div class="abs hd"><div class="brand"><span id="logo"></span>WaveCast</div><div class="fm">AI 音乐电台</div></div>
  <h1 class="abs">说一句，听一档，<br><em>再来下一档。</em></h1>
  <p class="abs sub">一句话变成一档<b>有音乐、有主持</b>的节目；听过的，又长成下一档。</p>

  <svg id="dial" class="abs" style="left:0;top:0" width="1200" height="1800"></svg>
  <div class="disc">
    <div class="abs" style="left:0;right:0;top:78px"><span class="tag"><i>1</i>说一句</span></div>
    <div class="abs q" style="left:0;right:0;top:122px">想找点和 Nujabes<br>类似的<i></i></div>
    <svg class="abs" style="left:50%;top:272px;margin-left:-14px" width="28" height="44" viewBox="0 0 28 44"><path d="M14 2v34M5 28l9 10 9-10" fill="none" stroke="#FF6B2C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="abs" style="left:0;right:0;top:330px"><span class="tag"><i>2–3</i>一档节目</span></div>
    <div class="abs pt" style="left:0;right:0;top:372px">Nujabes 之后</div>
    <div class="abs pm" style="left:0;right:0;top:446px">FM 93.1 唱片行 · 约 40 分钟</div>
  </div>
  <div class="abs leg"><span><u style="background:#FF6B2C;width:4px;height:20px"></u>正在播放</span><span><u style="background:#5CC9B4"></u>音乐</span><span><u style="background:#FF6B2C"></u>主持开口，音乐自动让路</span><span><u style="background:rgba(92,201,180,.3)"></u>正在往前生成</span></div>

  <div class="abs blk-l"><div class="t"><em>4</em> 听过的，<br>变成下一档</div><p>因为你听了<br><b>《Aruarian Dance》</b></p></div>
  <div id="cards"></div>
  <div class="abs qr"><div class="q2"><svg id="qr" width="96" height="96"></svg></div><div><div class="u">wavecast<em>.</em>space</div><div class="h">扫码打开<br>说一句想听什么，电台马上开播</div></div></div>
  <div class="abs foot"><span></span><span>界面与节目内容为示意</span></div>
  <div class="grain" style="opacity:.09"></div>
</div>
<script src="../dist/wc.js"></script>
<script>
const W=WC,NS="http://www.w3.org/2000/svg";
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
document.getElementById("logo").innerHTML=W.logo(true);
const s=document.getElementById("dial"),cx=600,cy=860,R=452,TAU=Math.PI*2;
const P=(r,deg)=>{const a=(deg-90)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]}; // deg: 0 = top, clockwise
const cols=["#E8834A","#3E9C8C","#C9A04A","#5C7CE0","#6E62B6"];
// FM tick ring
for(let i=0;i<246;i++){const d=i*360/246,big=i%12===0,mid=i%6===0,[a,b]=[P(396,d),P(396+(big?30:mid?20:11),d)];
 el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:big?"rgba(243,241,250,.6)":"rgba(243,241,250,.24)","stroke-width":big?2.2:1.2},s)}
el("circle",{cx,cy,r:392,fill:"none",stroke:"rgba(243,241,250,.14)"},s);
W.STATIONS.forEach((st,k)=>{const d=(st.freq-87.5)/20.5*360,[x,y]=P(380,d);el("circle",{cx:x,cy:y,r:7,fill:cols[k],stroke:"#0A0D20","stroke-width":2.5},s)});
// radial programme waveform
const Rm=332,N=300,Rn=W.rng(11);
const tracks=[[0,.22],[.235,.47],[.485,.72]],host=[[.025,.075],[.2,.245],[.45,.505],[.615,.665]];
const play=.31,ghostEnd=.94;
host.forEach(([a,b])=>{ // orange band + arc
 const [x0,y0]=P(Rm+46,a*360),[x1,y1]=P(Rm+46,b*360);
 el("path",{d:`M${x0} ${y0}A${Rm+46} ${Rm+46} 0 0 1 ${x1} ${y1}`,fill:"none",stroke:"#FF6B2C","stroke-width":9,"stroke-linecap":"round"},s);
 const q0=P(Rm-48,a*360),q1=P(Rm-48,b*360);el("path",{d:`M${q0[0]} ${q0[1]}A${Rm-48} ${Rm-48} 0 0 1 ${q1[0]} ${q1[1]}`,fill:"none",stroke:"#FF6B2C","stroke-width":3,"stroke-linecap":"round",opacity:.55},s)});
for(let i=0;i<N;i++){const u=i/N,d=u*360;
 const inT=tracks.some(t=>u>=t[0]&&u<=t[1]-.004),ghost=u>.72&&u<=ghostEnd;
 if(!inT&&!ghost)continue;
 let env=.3+.7*Math.abs(Math.sin(u*61)*Math.cos(u*17+1));env=.3+.7*env*(.5+.5*Rn());
 const duck=host.some(h=>u>=h[0]&&u<=h[1]);
 let len=(ghost?env*.62*(1-(u-.72)/(ghostEnd-.72)*.7):env)*(duck?.35:1)*44;
 const a=P(Rm-len*.6,d),b=P(Rm+len*.6,d);
 const col=ghost?"#5CC9B4":(u<play?"#3E8E80":"#5CC9B4");
 el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:col,"stroke-width":3.2,"stroke-linecap":"round",opacity:ghost?.5*(1-(u-.72)/(ghostEnd-.72)):1},s)}
// playhead
{const a=P(Rm-72,play*360),b=P(Rm+74,play*360);
 el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:"#FF6B2C","stroke-width":9,opacity:.2,"stroke-linecap":"round",filter:"blur(5px)"},s);
 el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:"#FF6B2C","stroke-width":3.5,"stroke-linecap":"round"},s);
}
// curved captions on the ring
const defs=el("defs",{},s);
const Rt=R-8,Rb=R+16;
el("path",{id:"top",d:`M${cx-Rt} ${cy}A${Rt} ${Rt} 0 0 1 ${cx+Rt} ${cy}`,fill:"none"},defs);
el("path",{id:"bot",d:`M${cx-Rb} ${cy}A${Rb} ${Rb} 0 0 0 ${cx+Rb} ${cy}`,fill:"none"},defs);
const cap=(id,off,txt)=>{const t=el("text",{"font-size":26,"font-weight":500,fill:"#F3F1FA","font-family":"WC Sans","letter-spacing":".16em","text-anchor":"middle"},s);const tp=el("textPath",{href:"#"+id,startOffset:off},t);tp.textContent=txt};
cap("top","24%","①  说一句想听什么");cap("top","76%","②  检索 · 选曲 · 规划路线");
cap("bot","25%","④  听过的，变成下一档");cap("bot","75%","③  主持与音乐同轨，边播边生成");
// flow chevrons (clockwise)
[[0,0],[90,0],[180,0],[270,0]].forEach(([d])=>{const p=P(R+2,d),ang=d; // tangent direction clockwise
 el("path",{d:"M-9 -11 L9 0 L-9 11",fill:"none",stroke:"#FF6B2C","stroke-width":4,"stroke-linecap":"round","stroke-linejoin":"round",transform:`translate(${p[0]} ${p[1]}) rotate(${ang})`},s)});
// recommendation cards
(()=>{const h=document.getElementById("cards");
 const cs=[["lineage|71|钢琴三重奏\\n入门","钢琴三重奏入门","来龙去脉 · 约 40 分钟"],["night|88|深夜的\\nECM","深夜的 ECM","夜里 · 约 45 分钟"],["casual|95|雨天的\\nBossa Nova","雨天的 Bossa Nova","随便听 · 约 30 分钟"],["crate|104|Bill Evans\\n之后","Bill Evans 之后","唱片行 · 约 40 分钟"]];
 cs.forEach((c,i)=>{const d=document.createElement("div");d.className="card";d.style.left=(440+i*(150+20))+"px";d.innerHTML=`<div class="cv"><div data-cover="${c[0]}"></div></div><div class="ti">${c[1]}</div><div class="me">${c[2]}</div>`;h.appendChild(d)});W.mountCovers(h)})();
(()=>{const q=W.qrPath("https://wavecast.space",1),e=document.getElementById("qr");e.setAttribute("viewBox",`0 0 ${q.size} ${q.size}`);el("path",{d:q.d,fill:"#0A0D20"},e)})();
</script></body></html>
