name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wavecast
          POSTGRES_PASSWORD: wavecast
          POSTGRES_DB: wavecast
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U wavecast -d wavecast"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      WAVECAST_TEST_DATABASE_URL: postgresql+asyncpg://wavecast:wavecast@127.0.0.1:5432/wavecast
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ffmpeg -version
      - run: ffprobe -version
      - run: uv sync --all-groups
      - run: uv run alembic upgrade head
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:web
      - run: WAVECAST_INTERNAL_API_URL=https://api.example.test pnpm build
      - run: python3 scripts/vercel_rewrite_smoke.py --expected https://api.example.test/api/:path*

  deployment-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker compose -f docker-compose.prod.yml build
      - run: docker compose -f docker-compose.prod.yml up -d
      - run: uv run python scripts/deployment_smoke.py --restart-api --compose-file docker-compose.prod.yml
      - if: always()
        run: docker compose -f docker-compose.prod.yml logs --no-color
      - if: always()
        run: docker compose -f docker-compose.prod.yml down -v
